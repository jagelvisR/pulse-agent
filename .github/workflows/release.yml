name: Release Static Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset_name: pulse-agent-linux-x86_64
            use_zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset_name: pulse-agent-linux-aarch64
            use_zig: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: pulse-agent-windows-x86_64.exe
            use_zig: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Zig & cargo-zigbuild (Linux musl static)
        if: matrix.use_zig
        run: |
          pipx install ziglang
          cargo install --locked cargo-zigbuild

      - name: Build static binary (Linux musl)
        if: matrix.use_zig
        run: |
          cargo zigbuild --release --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/pulse-agent dist/${{ matrix.asset_name }}
          strip dist/${{ matrix.asset_name }} || true

      - name: Build binary (Windows MSVC)
        if: ${{ !matrix.use_zig }}
        shell: pwsh
        run: |
          cargo build --release --target ${{ matrix.target }}
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/pulse-agent.exe dist/${{ matrix.asset_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums & include example config
        working-directory: release-assets
        run: |
          sha256sum pulse-agent-* > SHA256SUMS.txt
          cp ../pulse.example.toml .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/pulse-agent-linux-x86_64
            release-assets/pulse-agent-linux-aarch64
            release-assets/pulse-agent-windows-x86_64.exe
            release-assets/SHA256SUMS.txt
            release-assets/pulse.example.toml