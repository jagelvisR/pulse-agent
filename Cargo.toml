[package]
name = "pulse-agent"
version = "0.2.0"
edition = "2024"
authors = ["Jose Agelvis <jagelvisr@users.noreply.github.com>"]
description = "Agente ultraligero de telemetría, monitoreo TUI y alertas instantáneas en Rust"
license = "MIT"
repository = "https://github.com/jagelvisr/pulse-agent"
readme = "README.md"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bollard = "0.18"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls-pki-types = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.32"
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "time", "signal", "fs", "sync", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webpki-roots = "0.26"
x509-parser = "0.16"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"